<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ain Shams University · Classroom 50 Interactive Student Walkthrough</title>
  <link rel="icon" href="ar_logo.png" type="image/png" />
  <style>
    :root {
      --bg: #0b0e1d;
      --card: #161c34;
      --border: #34416e;
      --panel: #0a0d18;
      --text: #edf2fc;
      --muted: #9eaac9;
      --cyan: #38d9f5;
      --purple: #b07cff;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      user-select: none;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-play {
      background: var(--cyan);
      color: #0a0d18;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-play:hover { opacity: 0.9; }
    .step-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .tabs {
      display: flex;
      gap: 5px;
    }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--cyan);
      color: #0a0d18;
      border-color: var(--cyan);
      font-weight: 700;
    }
    .stage-grid {
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 12px;
    }
    @media (max-width: 680px) {
      .stage-grid { grid-template-columns: 1fr; }
    }
    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .kicker {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--cyan);
      margin-bottom: 4px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .action-box {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .action-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .action-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
    }
    .btn-copy {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 11.5px;
      cursor: pointer;
    }
    .btn-copy:hover { border-color: var(--cyan); }
    .action-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      background: var(--panel);
      color: var(--cyan);
      padding: 8px;
      border-radius: 6px;
      word-break: break-all;
      border: 1px solid rgba(52, 65, 110, 0.5);
    }
    .win-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .win-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.r { background: var(--red); }
    .dot.y { background: var(--amber); }
    .dot.g { background: var(--green); }
    .win-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
      margin-left: 6px;
    }
    .win-status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--green);
      font-weight: 600;
    }
    .visual-stage {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 195px;
      justify-content: center;
    }
    .sub-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      line-height: 1.55;
    }
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .warn-box {
      border: 1px solid var(--amber);
      background: rgba(251, 191, 36, 0.08);
      color: var(--amber);
      border-radius: 8px;
      padding: 8px 10px;
      line-height: 1.45;
    }
    .err-box {
      border: 1px solid var(--red);
      background: rgba(248, 113, 113, 0.1);
      color: var(--red);
      border-radius: 8px;
      padding: 8px 10px;
      line-height: 1.45;
    }
    .pill-ok {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--green);
      color: #0a0d18;
      font-weight: 700;
    }
    .c-cyan { color: var(--cyan); }
    .c-green { color: var(--green); }
    .c-muted { color: var(--muted); }
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 99px;
      background: var(--panel);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--cyan);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="top-left">
        <button id="playBtn" class="btn-play" onclick="togglePlay()">⏸ Pause Tour</button>
        <span id="stepBadge" class="step-badge">Step 1 / 6</span>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="stage-grid">
      <div class="panel-card">
        <div>
          <div class="kicker" id="stageKicker"></div>
          <h3 class="title" id="stageTitle"></h3>
          <p class="desc" id="stageDesc"></p>
        </div>
        <div class="action-box">
          <div class="action-head">
            <span class="action-label" id="actionLabel">Official Link</span>
            <button class="btn-copy" id="copyBtn" onclick="copyCurrent()">Copy</button>
          </div>
          <div class="action-val" id="actionValue"></div>
        </div>
      </div>

      <div class="panel-card">
        <div class="win-top">
          <div class="win-dots">
            <span class="dot r"></span>
            <span class="dot y"></span>
            <span class="dot g"></span>
            <span class="win-title" id="windowHeader"></span>
          </div>
          <span class="win-status" id="windowStatus"></span>
        </div>
        <div class="visual-stage" id="visualStage"></div>
      </div>
    </div>

    <div class="progress-track">
      <div id="progressBar" class="progress-fill" style="width: 16.6%"></div>
    </div>
  </div>

  <script>
    const STEPS = [
      {
        kicker: "Overview · Ain Shams Engineering",
        title: "Welcome to Fundamentals of Computer Programming",
        desc: "Our course uses Classroom 50 (classroom50.org) on GitHub. Your starter code, automated C++ tests, scores, and TA feedback all live inside your GitHub repository.",
        actionLabel: "Course Landing Page",
        actionValue: "https://asu-computer-and-systems-engineering.github.io/",
        winHeader: "asu-computer-and-systems-engineering.github.io",
        winStatus: "● Fall 2026 Live",
        render: () => `
          <div class="sub-box">
            <div><b>Ain Shams University · Faculty of Engineering</b></div>
            <div class="c-muted">Classroom: <span class="c-cyan">fall26-fop</span> (Fundamentals of Computer Programming)</div>
          </div>
          <div class="mini-grid">
            <div class="sub-box"><div class="c-cyan"><b>1. Join Org</b></div><div class="c-muted">Accept invite to ASU-Computer-and-Systems-Engineering</div></div>
            <div class="sub-box"><div class="c-cyan"><b>2. Accept</b></div><div class="c-muted">Get your private C++ repo</div></div>
            <div class="sub-box"><div class="c-green"><b>3. Push</b></div><div class="c-muted">Auto-graded on every push</div></div>
          </div>
        `
      },
      {
        kicker: "Step 1 · Required First Step",
        title: "Accept the GitHub Organization Invitation",
        desc: "Check your email or open github.com/ASU-Computer-and-Systems-Engineering and accept the invitation. This enrolls you in the classroom50-fall26-fop student team.",
        actionLabel: "GitHub Organization URL",
        actionValue: "https://github.com/ASU-Computer-and-Systems-Engineering",
        winHeader: "github.com/ASU-Computer-and-Systems-Engineering",
        winStatus: "✓ Team: classroom50-fall26-fop",
        render: () => `
          <div class="sub-box">
            <div><b>📨 You've been invited to join ASU-Computer-and-Systems-Engineering</b></div>
            <div class="c-muted">Invited by course staff · Adds you to team <span class="c-cyan">classroom50-fall26-fop</span></div>
            <div class="pill-ok">✓ Accept Invitation</div>
          </div>
          <div class="warn-box">
            ⚠ If skipped, assignment links say: "This assignment isn't available to you."
          </div>
        `
      },
      {
        kicker: "Step 2 · Get Your Repository",
        title: "Accept the 'Hello, World!' Assignment",
        desc: "Open the assignment link on classroom50.org and click 'Accept assignment'. It clones fall26-fop-hello-template into your personal private repository.",
        actionLabel: "Assignment 1 ('hello') Accept Link",
        actionValue: "https://classroom50.org/ASU-Computer-and-Systems-Engineering/fall26-fop/assignments/hello/accept?k=fall26fop",
        winHeader: "classroom50.org · Accept Assignment",
        winStatus: "✓ Repo Created",
        render: () => `
          <div class="sub-box">
            <div class="c-green">✓ Created private repo: <b>ASU-Computer-and-Systems-Engineering/fall26-fop-hello-student</b></div>
            <div class="c-green">✓ Copied starter code: <b>README.md</b>, <b>hello.cpp</b></div>
            <div class="c-green">✓ Committed <b>.classroom50.yaml</b> &amp; <b>.github/workflows/autograde.yaml</b></div>
            <div class="c-green">✓ Opened <b>Feedback Pull Request #1</b> (main &rarr; feedback)</div>
          </div>
          <div class="c-muted">
            CLI option: <span class="c-cyan">gh student accept ASU-Computer-and-Systems-Engineering fall26-fop hello --key fall26fop</span>
          </div>
        `
      },
      {
        kicker: "Step 3 · Code, Compile & Submit",
        title: "Edit hello.cpp, Test with g++, and Push",
        desc: "Clone your personal repo, make hello.cpp print 'Hello, world!', test locally, then commit and push (or run 'gh student submit').",
        actionLabel: "Terminal Commands",
        actionValue: "g++ -o hello hello.cpp && ./hello && git add hello.cpp && git commit -m \"Solve hello\" && git push",
        winHeader: "bash — fall26-fop-hello-student",
        winStatus: "● Pushed to main",
        render: () => `
          <div class="sub-box">
            <div class="c-cyan">$ g++ -o hello hello.cpp &amp;&amp; ./hello</div>
            <div class="c-green">Hello, world!</div>
            <div class="c-cyan">$ git add hello.cpp &amp;&amp; git commit -m "Implement Hello, world!"</div>
            <div class="c-cyan">$ git push</div>
            <div class="c-muted">main -&gt; main (Triggered Classroom50 Autograde Runner)</div>
          </div>
          <div class="err-box">
            ✗ Do NOT edit/delete <b>.classroom50.yaml</b> or <b>.github/workflows/autograde.yaml</b>!
          </div>
        `
      },
      {
        kicker: "Step 4 · Autograding & Code Review",
        title: "Check Your Score in Releases & Feedback PR",
        desc: "Every push creates a 'submit/*' GitHub Release with your test breakdown and updates Pull Request #1 ('Feedback') for inline teacher/TA comments.",
        actionLabel: "Classroom Dashboard",
        actionValue: "https://classroom50.org/ASU-Computer-and-Systems-Engineering/fall26-fop/assignments",
        winHeader: "GitHub Releases & Pull Request #1",
        winStatus: "★ Score: 3 / 3",
        render: () => `
          <div class="sub-box">
            <div class="c-green"><b>Release: Submission submit/2026-11-20T... · Score: 3 / 3</b></div>
            <div class="c-muted" style="margin-top:4px;">compiles (g++): <b class="c-green">PASS (1/1)</b> &nbsp;|&nbsp; prints hello: <b class="c-green">PASS (2/2)</b></div>
          </div>
          <div class="sub-box">
            <div class="c-cyan"><b>Pull Request #1: Feedback (base: feedback &larr; head: main)</b></div>
            <div class="c-muted">Click <b>Subscribe</b> for TA comments. Never close or merge this PR yourself!</div>
          </div>
        `
      },
      {
        kicker: "Step 5 · Summary",
        title: "4 Golden Rules for Classroom 50",
        desc: "Follow these four rules on every assignment in Fundamentals of Computer Programming to ensure smooth autograding.",
        actionLabel: "HelloWorld (C) Accept Link",
        actionValue: "https://classroom50.org/ASU-Computer-and-Systems-Engineering/fall26-fop/assignments/helloworld/accept?k=fall26fop",
        winHeader: "Golden Rules Checklist",
        winStatus: "✓ Ready to Code",
        render: () => `
          <div class="sub-box">
            <div><b class="c-green">1.</b> Never modify <b>.classroom50.yaml</b> or <b>.github/workflows/autograde.yaml</b>.</div>
            <div><b class="c-green">2.</b> Only edit allowed files (<b>hello.cpp</b>); extra files are stripped at grade time.</div>
            <div><b class="c-green">3.</b> Clone your personal <b>fall26-fop-hello-&lt;username&gt;</b> repo, never the <b>-template</b> repo.</div>
            <div><b class="c-green">4.</b> Keep the <b>Feedback</b> Pull Request open; if setup breaks, click <b>Re-run setup</b> on the accept link.</div>
          </div>
        `
      }
    ];

    let current = 0;
    let playing = true;
    let timer = null;

    function renderTabs() {
      const wrap = document.getElementById("tabs");
      wrap.innerHTML = STEPS.map((_, idx) => `
        <button onclick="goToStep(${idx})" class="tab-btn ${idx === current ? "active" : ""}">${idx + 1}</button>
      `).join("");
    }

    function renderStep() {
      const s = STEPS[current];
      document.getElementById("stepBadge").textContent = `Step ${current + 1} / ${STEPS.length}`;
      document.getElementById("stageKicker").textContent = s.kicker;
      document.getElementById("stageTitle").textContent = s.title;
      document.getElementById("stageDesc").textContent = s.desc;
      document.getElementById("actionLabel").textContent = s.actionLabel;
      document.getElementById("actionValue").textContent = s.actionValue;
      document.getElementById("windowHeader").textContent = s.winHeader;
      document.getElementById("windowStatus").textContent = s.winStatus;
      document.getElementById("visualStage").innerHTML = s.render();
      document.getElementById("progressBar").style.width = `${((current + 1) / STEPS.length) * 100}%`;
      renderTabs();
    }

    function goToStep(idx) {
      current = idx;
      renderStep();
      if (playing) restartTimer();
    }

    function togglePlay() {
      playing = !playing;
      document.getElementById("playBtn").textContent = playing ? "⏸ Pause Tour" : "▶ Play Tour";
      if (playing) restartTimer();
      else if (timer) clearInterval(timer);
    }

    function restartTimer() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        current = (current + 1) % STEPS.length;
        renderStep();
      }, 4500);
    }

    function copyCurrent() {
      const text = STEPS[current].actionValue;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById("copyBtn");
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy"; }, 1200);
    }

    renderStep();
    restartTimer();
  </script>
</body>
</html>
